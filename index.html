<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti 💛</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <main class="scene">
    <p class="intro">Tengo algo para ti...</p>

    <div class="garden">
      <div class="stem stem-main"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>

      <div class="rose rose-main">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="center"></span>
      </div>

      <div class="small-rose r-left">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="center"></span>
      </div>

      <div class="small-rose r-right">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="center"></span>
      </div>
    </div>

    <section class="message">
      <h1>Para ti, con mucho cariño 💛</h1>
      <p>Porque hay personas que merecen recibir algo bonito sin necesidad de una fecha especial.</p>
      <button id="more">✨ Para ti</button>
    </section>
  </main>

  <div id="petals"></div>
  <script src="script.js"></script>
</body>
</html>
